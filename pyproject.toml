[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defineutils"
version = "0.4.0"
description = "CDISC Define-XML v2.1 utilities"
readme = "README.md"
authors = [{ name = "Sam Hume", email = "swhume@gmail.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["define.xml", "Define-XML", "CDISC"]
dependencies = [
    "elementpath>=5.0.4",
    "lxml >= 6.0.1",
    "odmlib >= 0.2.0",
    "xmlschema >= 4.1.0",
    'tomli; python_version < "3.11"',
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/swhume/defineutils"

[project.scripts]
# each command calls run(), not main(): run() holds the Ctrl-C / broken-pipe handling
definehtml = "defineutils.definehtml.__main__:run"
definevalidate = "defineutils.validate.__main__:run"
definepp = "defineutils.definepp.__main__:run"
definerefs = "defineutils.definerefs.__main__:run"
definemetrics = "defineutils.metrics.__main__:run"

[project.gui-scripts]
# a GUI script: on Windows pip installs it with a windowed launcher, so opening a define.xml with it opens no console
# window. It calls run() too
defineview = "defineutils.defineview.__main__:run"

[tool.setuptools]
packages = ["defineutils", "defineutils.definehtml", "defineutils.validate", "defineutils.definepp",
            "defineutils.definerefs", "defineutils.metrics", "defineutils.defineview"]

[tool.setuptools.package-data]
# Include non-Python files needed at runtime (schemas, XSL)
"defineutils.definehtml" = ["define2-1.xsl", "define2-1.xsl.LICENSE"]
"defineutils.validate" = [
  "schema/cdisc-arm-1.0/*.xsd",
  "schema/cdisc-define-2.1/*.xsd",
  "schema/cdisc-define-2.1/*.html",
  "schema/cdisc-odm-1.3.2/*.xsd",
  "schema/core/*.xsd"
]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*", "tests"]